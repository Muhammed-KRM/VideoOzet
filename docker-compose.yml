services:
  api:
    build:
      context: .
      dockerfile: src/VideoOzet.API/Dockerfile
    ports: ["5001:8080"]
    depends_on: [postgres, redis, rabbitmq, minio]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videoozet;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - Minio__BucketName=videolar
      - Minio__UseSSL=false
      - ApiKey=${ADMIN_API_KEY:-SUPER_SECRET_API_KEY_123!}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  worker:
    build:
      context: .
      dockerfile: src/VideoOzet.Worker/Dockerfile
    depends_on: [postgres, redis, rabbitmq, minio, ollama]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videoozet;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - Minio__BucketName=videolar
      - Minio__UseSSL=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: videoozet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  pgdata:
  ollama_data:
  minio_data:
