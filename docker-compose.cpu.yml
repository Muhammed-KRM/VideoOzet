# NVIDIA GPU bulunmayan bilgisayarlar için CPU optimizasyonlu Ollama override dosyası.
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
services:
  ollama:
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices: []
