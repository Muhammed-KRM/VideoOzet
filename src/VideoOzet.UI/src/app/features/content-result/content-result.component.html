<div class="bg-slate-800 rounded-xl border border-slate-700/50 overflow-hidden shadow-2xl">
  
  <!-- Loading skeleton -->
  <div *ngIf="isLoading" class="p-8 animate-pulse">
    <div class="h-8 bg-slate-700 rounded w-1/3 mb-6"></div>
    <div class="space-y-3">
      <div class="h-4 bg-slate-700 rounded w-full"></div>
      <div class="h-4 bg-slate-700 rounded w-5/6"></div>
      <div class="h-4 bg-slate-700 rounded w-4/6"></div>
    </div>
  </div>

  <!-- Content -->
  <div *ngIf="!isLoading && result">
    <!-- Tabs -->
    <div class="flex border-b border-slate-700 bg-slate-900/50">
      <button 
        (click)="activeTab = 'ozet'"
        [class.border-blue-500]="activeTab === 'ozet'"
        [class.text-blue-400]="activeTab === 'ozet'"
        [class.text-slate-400]="activeTab !== 'ozet'"
        class="flex-1 py-4 px-6 text-sm font-medium border-b-2 border-transparent hover:text-slate-200 transition-colors"
      >
        Araştırma Özeti
      </button>
      <button 
        (click)="activeTab = 'plan'"
        [class.border-blue-500]="activeTab === 'plan'"
        [class.text-blue-400]="activeTab === 'plan'"
        [class.text-slate-400]="activeTab !== 'plan'"
        class="flex-1 py-4 px-6 text-sm font-medium border-b-2 border-transparent hover:text-slate-200 transition-colors"
      >
        Video Planı
      </button>
      <button 
        (click)="activeTab = 'qc'"
        [class.border-blue-500]="activeTab === 'qc'"
        [class.text-blue-400]="activeTab === 'qc'"
        [class.text-slate-400]="activeTab !== 'qc'"
        class="flex-1 py-4 px-6 text-sm font-medium border-b-2 border-transparent hover:text-slate-200 transition-colors flex items-center justify-center gap-2"
      >
        QC Raporu
        <span class="px-2 py-0.5 rounded-full bg-slate-800 text-xs font-bold"
          [ngClass]="{
            'text-emerald-400': result.qcResult?.guvenSkorYuzde >= 80,
            'text-amber-400': result.qcResult?.guvenSkorYuzde >= 50 && result.qcResult?.guvenSkorYuzde < 80,
            'text-red-400': result.qcResult?.guvenSkorYuzde < 50
          }"
        >
          %{{ result.qcResult?.guvenSkorYuzde || 0 }}
        </span>
      </button>
    </div>

    <!-- Tab Content -->
    <div class="p-8">
      
      <!-- Özet Tab -->
      <div *ngIf="activeTab === 'ozet'" class="prose prose-invert prose-blue max-w-none" [innerHTML]="parsedOzet"></div>
      
      <!-- Plan Tab -->
      <div *ngIf="activeTab === 'plan'" class="prose prose-invert prose-blue max-w-none" [innerHTML]="parsedPlan"></div>
      
      <!-- QC Tab -->
      <div *ngIf="activeTab === 'qc'">
        <div class="mb-6 grid grid-cols-3 gap-4 text-center">
          <div class="bg-slate-900 rounded-lg p-4 border border-slate-700">
            <div class="text-3xl font-bold text-emerald-400 mb-1">{{ result.qcResult?.desteklenenSayisi || 0 }}</div>
            <div class="text-sm text-slate-400">Doğrulanan İddia</div>
          </div>
          <div class="bg-slate-900 rounded-lg p-4 border border-slate-700">
            <div class="text-3xl font-bold text-amber-400 mb-1">{{ result.qcResult?.belirsizSayisi || 0 }}</div>
            <div class="text-sm text-slate-400">Belirsiz İddia</div>
          </div>
          <div class="bg-slate-900 rounded-lg p-4 border border-slate-700">
            <div class="text-3xl font-bold text-red-400 mb-1">{{ result.qcResult?.desteklenmeyenSayisi || 0 }}</div>
            <div class="text-sm text-slate-400">Desteklenmeyen</div>
          </div>
        </div>

        <div class="space-y-4">
          <h3 class="text-lg font-medium text-white mb-4">İddia Doğrulama Detayları</h3>
          <div *ngFor="let item of result.qcResult?.detayliRapor" class="p-4 rounded-lg bg-slate-900 border border-slate-700">
            <div class="flex items-start gap-3">
              <div class="mt-1">
                <span *ngIf="item.durum === 'desteklendi'" class="text-emerald-400 text-xl">✅</span>
                <span *ngIf="item.durum === 'belirsiz'" class="text-amber-400 text-xl">⚠️</span>
                <span *ngIf="item.durum === 'desteklenmedi'" class="text-red-400 text-xl">❌</span>
              </div>
              <div>
                <p class="text-white font-medium mb-2">{{ item.iddia }}</p>
                <div class="bg-slate-800 rounded p-3 text-sm text-slate-300 border border-slate-700">
                  <span class="text-slate-500 font-medium block mb-1">Kaynak Açıklaması:</span>
                  {{ item.aciklama }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
