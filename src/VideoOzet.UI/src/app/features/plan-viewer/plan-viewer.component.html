<div class="h-full w-full bg-slate-900 rounded-xl overflow-hidden border border-slate-700/50 shadow-xl flex flex-col">
  <!-- Tabs Header -->
  <div class="flex border-b border-slate-700/50 bg-slate-800">
    <button 
      class="flex-1 py-3 text-sm font-medium transition-colors"
      [ngClass]="activeTab === 'plan' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-700/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/20'"
      (click)="activeTab = 'plan'">
      Video Planı
    </button>
    <button 
      class="flex-1 py-3 text-sm font-medium transition-colors"
      [ngClass]="activeTab === 'ozet' ? 'text-indigo-400 border-b-2 border-indigo-400 bg-slate-700/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/20'"
      (click)="activeTab = 'ozet'">
      Araştırma Özeti
    </button>
    <button 
      class="flex-1 py-3 text-sm font-medium transition-colors"
      [ngClass]="activeTab === 'qc' ? 'text-emerald-400 border-b-2 border-emerald-400 bg-emerald-900/10' : 'text-slate-400 hover:text-emerald-300 hover:bg-emerald-900/5'"
      (click)="activeTab = 'qc'">
      Kalite Kontrol ({{ revision?.guvenSkorYuzde || 0 }}%)
    </button>
  </div>

  <!-- Content Area (Scrollable) -->
  <div class="flex-1 overflow-y-auto p-6 custom-scrollbar text-slate-300 leading-relaxed text-sm">
    
    <!-- PLAN TAB -->
    <div *ngIf="activeTab === 'plan'" [innerHTML]="formattedPlan"></div>

    <!-- ÖZET TAB -->
    <div *ngIf="activeTab === 'ozet'" [innerHTML]="formattedOzet"></div>

    <!-- QC TAB -->
    <div *ngIf="activeTab === 'qc'" class="space-y-6">
      <div class="flex justify-between items-center p-4 rounded-lg bg-slate-800 border border-slate-700">
        <div>
          <p class="text-sm text-slate-400">Doğruluk Skoru</p>
          <div class="text-3xl font-bold" 
               [ngClass]="{'text-emerald-400': revision.guvenSkorYuzde >= 80, 'text-amber-400': revision.guvenSkorYuzde >= 50 && revision.guvenSkorYuzde < 80, 'text-rose-400': revision.guvenSkorYuzde < 50}">
            %{{ revision.guvenSkorYuzde }}
          </div>
        </div>
        <div class="flex gap-4 text-center">
          <div>
            <div class="text-xl font-semibold text-emerald-400">{{ revision.desteklenenSayisi }}</div>
            <div class="text-xs text-slate-500 uppercase">Desteklenen</div>
          </div>
          <div>
            <div class="text-xl font-semibold text-amber-400">{{ revision.belirsizSayisi }}</div>
            <div class="text-xs text-slate-500 uppercase">Belirsiz</div>
          </div>
          <div>
            <div class="text-xl font-semibold text-rose-400">{{ revision.desteklenmeyenSayisi }}</div>
            <div class="text-xs text-slate-500 uppercase">Desteklenmeyen</div>
          </div>
        </div>
      </div>

      <div class="space-y-3">
        <div *ngFor="let item of qcRaporList" class="p-4 rounded-lg border bg-slate-800"
             [ngClass]="{'border-emerald-500/30': item.durum === 'desteklendi', 'border-amber-500/30': item.durum === 'belirsiz', 'border-rose-500/30': item.durum === 'desteklenmedi'}">
          <div class="flex items-start justify-between gap-4">
            <h4 class="font-medium text-white flex-1">{{ item.iddia }}</h4>
            <span class="px-2.5 py-1 rounded text-xs font-bold uppercase tracking-wider shrink-0"
                  [ngClass]="{'bg-emerald-500/20 text-emerald-400': item.durum === 'desteklendi', 'bg-amber-500/20 text-amber-400': item.durum === 'belirsiz', 'bg-rose-500/20 text-rose-400': item.durum === 'desteklenmedi'}">
              {{ item.durum }}
            </span>
          </div>
          <p class="text-sm text-slate-400 mt-2">{{ item.aciklama }}</p>
        </div>
        
        <div *ngIf="qcRaporList.length === 0" class="text-center py-8 text-slate-500">
          Detaylı QC raporu bulunamadı.
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="p-4 bg-slate-800 border-t border-slate-700/50 flex justify-end gap-3">
    <button (click)="downloadMarkdown()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Markdown İndir
    </button>
  </div>
</div>
