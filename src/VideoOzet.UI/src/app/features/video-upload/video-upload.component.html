<div 
  class="relative border-2 border-dashed rounded-xl p-8 text-center transition-all"
  [ngClass]="{
    'border-blue-500 bg-blue-500/10': isDragging,
    'border-slate-600 bg-slate-800/50 hover:bg-slate-700/50 hover:border-slate-500': !isDragging
  }"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input 
    type="file" 
    #fileInput 
    (change)="onFileSelected($event)" 
    accept="video/*" 
    class="hidden"
  >
  
  <div *ngIf="!isUploading">
    <div class="w-16 h-16 mx-auto mb-4 bg-slate-700 rounded-full flex items-center justify-center text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
    </div>
    <h3 class="text-lg font-medium text-white mb-1">Videoları Sürükleyip Bırakın</h3>
    <p class="text-slate-400 text-sm mb-4">veya bilgisayarınızdan seçin</p>
    <button 
      (click)="fileInput.click()"
      class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors"
    >
      Dosya Seç
    </button>
  </div>

  <div *ngIf="isUploading" class="py-4">
    <div class="animate-spin mx-auto h-10 w-10 border-4 border-slate-600 border-t-blue-500 rounded-full mb-4"></div>
    <h3 class="text-white font-medium">Video Yükleniyor...</h3>
    <p class="text-sm text-slate-400">Lütfen tarayıcıyı kapatmayın</p>
  </div>
</div>
