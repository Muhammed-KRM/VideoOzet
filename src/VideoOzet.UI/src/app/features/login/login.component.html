<div class="flex items-center justify-center min-h-screen bg-slate-900">
  <div class="w-full max-w-md p-8 space-y-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700/50 backdrop-blur-sm">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-white mb-2">Video Özet Sistemi</h1>
      <p class="text-slate-400">Yönetim paneline erişmek için API anahtarınızı girin.</p>
    </div>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label for="apiKey" class="block text-sm font-medium text-slate-300 mb-1">Admin API Anahtarı</label>
        <input
          id="apiKey"
          name="apiKey"
          type="password"
          [(ngModel)]="apiKey"
          required
          placeholder="sk-admin-..."
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-slate-600"
        />
      </div>

      <div *ngIf="errorMessage" class="text-red-400 text-sm bg-red-400/10 p-3 rounded-lg border border-red-400/20">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading || !apiKey"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-lg shadow-blue-500/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        <span *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-2 border-white/20 border-t-white"></span>
        {{ isLoading ? 'Doğrulanıyor...' : 'Sisteme Gir' }}
      </button>
    </form>
  </div>
</div>
